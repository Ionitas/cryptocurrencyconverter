name: cryptocurrencyconverter
description: "CurrencyX - Real-time cryptocurrency and fiat currency converter with 150+ currencies, portfolio tracking, and beautiful themes."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.1+6

environment:
  sdk: '>=3.0.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  auto_size_text_plus: ^3.0.2
  flutter_carousel_widget: ^3.0.0
  wolt_modal_sheet: ^0.11.0
  
  # Network
  http: 1.6.0
  
  # Local Storage
  shared_preferences: ^2.5.3
  
  # Dependency Injection
  get_it: ^9.2.1
  
  # In-App Purchases
  purchases_flutter: ^9.12.2
  purchases_ui_flutter: ^9.12.2
  
  # Analytics & Tracking
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.2
  app_tracking_transparency: ^2.0.6
  
  # Utilities
  url_launcher: ^6.2.6
  intl: ^0.20.2
  
  # Desktop Support
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0



flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
