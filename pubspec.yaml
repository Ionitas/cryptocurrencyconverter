name: cryptocurrencyconverter
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  auto_size_text_plus: ^3.0.2
  flutter_carousel_widget: ^3.0.0
  wolt_modal_sheet: ^0.11.0
  
  # Network
  http: 1.6.0
  
  # Local Storage
  shared_preferences: ^2.5.3
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Dependency Injection
  get_it: ^9.2.0
  
  # In-App Purchases
  purchases_flutter: ^9.10.1
  purchases_ui_flutter: ^9.10.1
  
  # Utilities
  url_launcher: ^6.2.6
  intl: ^0.20.2
  
  # Desktop Support
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0



flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
